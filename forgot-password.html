<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password | NestAxis Premium Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0A1628;
            --navy-light: #112240;
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --white: #FFFFFF;
            --white-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(10, 22, 40, 0.85);
            --font-display: 'Playfair Display', serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            background-color: var(--navy);
            background-image: url('assets/background.jpg'), url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: linear-gradient(135deg, rgba(10, 22, 40, 0.80) 0%, rgba(10, 22, 40, 0.65) 100%);
            z-index: 0;
        }

        .wrapper { position: relative; z-index: 1; width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(201, 168, 76, 0.25); border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 460px; }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo img { height: 64px; width: auto; max-width: 100%; object-fit: contain; }
        .card-header { text-align: center; margin-bottom: 32px; }
        .card-header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
        .card-header p { font-size: 14px; color: var(--white-muted); font-weight: 300; line-height: 1.5; }
        .divider { height: 1px; background: rgba(201, 168, 76, 0.2); margin-bottom: 24px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
        .form-input { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 14px 16px; font-family: var(--font-body); font-size: 15px; color: var(--white); outline: none; transition: border-color 0.2s ease; }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .form-input:focus { border-color: var(--gold); }
        
        .btn-primary { width: 100%; background: var(--gold); color: var(--navy); border: none; border-radius: 8px; padding: 15px; font-family: var(--font-body); font-size: 15px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s ease; margin-bottom: 24px; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
        .card-footer { text-align: center; font-size: 13px; color: var(--white-muted); }
        .card-footer a { color: var(--gold); text-decoration: none; font-weight: 500; }
        .card-footer a:hover { color: var(--gold-light); }
    </style>
</head>
<body>
    <div class="wrapper">
        <main class="card">
            <div class="logo"><img src="assets/logo.png" alt="NestAxis Logo"></div>
            <div class="card-header">
                <h1>Recover Access</h1>
                <p>Enter your verified email to receive security routing parameters</p>
            </div>
            <div class="divider"></div>
            <form action="verify-email.html" method="GET">
                <div class="form-group">
                    <label for="email">Account Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="investor@nestaxis.com" required>
                </div>
                <button type="submit" class="btn-primary">Send Verification Link</button>
            </form>
            <div class="card-footer">
                Remember your key? <a href="index.html">Return to Login</a>
            </div>
        </main>
    </div>
</body>
</html>
