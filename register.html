<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NestAxis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0A1628;
            --navy-light: #112240;
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --white: #FFFFFF;
            --white-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(10, 22, 40, 0.85);
            --font-display: 'Playfair Display', serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            background-color: var(--navy);
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(10, 22, 40, 0.75) 0%,
                rgba(10, 22, 40, 0.60) 100
            );
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 520px;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: contain;
            background: transparent;
        }

        .card-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .card-header h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 14px;
            color: var(--white-muted);
            font-weight: 300;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
        }

        .form-row-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-group select option {
            background: var(--navy);
            color: var(--white);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
        }

        .helper-text {
            font-size: 11px;
            color: var(--white-muted);
            margin-top: 6px;
        }

        .consent-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 28px;
        }

        .consent-group input[type="checkbox"] {
            accent-color: var(--gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .consent-group label {
            font-size: 13px;
            color: var(--white-muted);
            line-height: 1.5;
        }

        .consent-group label a {
            color: var(--gold);
            text-decoration: none;
        }

        .btn-primary {
            width: 100%;
            background: var(--gold);
            color: var(--navy);
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-bottom: 24px;
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .card-footer {
            text-align: center;
            font-size: 13px;
            color: var(--white-muted);
        }

        .card-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: rgba(201, 168, 76, 0.2);
            margin-bottom: 28px;
        }

        .section-gap {
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">

            <div class="logo">
                <img src="assets/logo.png" alt="NestAxis">
            </div>

            <div class="card-header">
                <h1>Create Account</h1>
                <p>Join NestAxis and start investing in properties</p>
            </div>

            <div class="divider"></div>

            <form id="registration-form">
                
                <div class="section-gap">
                    <p class="section-label">Your Details</p>

                    <div class="form-row-two">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                        <p class="helper-text">We'll send a verification link to this email.</p>
                    </div>
                </div>

                <div class="section-gap">
                    <p class="section-label">Investment Preferences</p>

                    <div class="form-group">
                        <label for="partner-type">Account Type</label>
                        <select id="partner-type" required>
                            <option value="" disabled selected>Select type...</option>
                            <option value="private">Private Investor</option>
                            <option value="institutional">Institution</option>
                            <option value="agent">Real Estate Agent</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="objective">Investment Focus</label>
                        <select id="objective" required>
                            <option value="" disabled selected>Select focus...</option>
                            <option value="luxury">Luxury Homes</option>
                            <option value="commercial">Commercial Property</option>
                            <option value="multifamily">Apartment Buildings</option>
                        </select>
                    </div>
                </div>

                <div class="section-gap">
                    <p class="section-label">Password</p>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
                        <p class="helper-text">Must be at least 8 characters long.</p>
                    </div>
                </div>

                <div class="consent-group">
                    <input type="checkbox" id="consent" required>
                    <label for="consent">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>

            </form>
            <div class="card-footer">
                Already have an account? <a href="index.html">Sign In</a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('registration-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const userFirstname = document.getElementById('firstname').value;
            
            alert(`Account created!\nWelcome, ${userFirstname}. Taking you to login...`);
            
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
