<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Login | NestAxis Premium Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0A1628;
            --navy-light: #112240;
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --white: #FFFFFF;
            --white-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(10, 22, 40, 0.85);
            --font-display: 'Playfair Display', serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            background-color: var(--navy);
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(10, 22, 40, 0.75) 0%,
                rgba(10, 22, 40, 0.60) 100%
            );
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo img {
            height: 64px;
            width: auto;
        }

        .card-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .card-header h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 14px;
            color: var(--white-muted);
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus {
            border-color: var(--gold);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: var(--white-muted);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--gold);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--gold-light);
        }

        .btn-primary {
            width: 100%;
            background: var(--gold);
            color: var(--navy);
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-bottom: 24px;
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .card-footer {
            text-align: center;
            font-size: 13px;
            color: var(--white-muted);
        }

        .card-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover {
            color: var(--gold-light);
        }

        .divider {
            height: 1px;
            background: rgba(201, 168, 76, 0.2);
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">

            <div class="logo">
                <img src="assets/logo.png" alt="NestAxis Logo">
            </div>

            <div class="card-header">
                <h1>Sign In to Portal</h1>
                <p>Access premium listings and active investments</p>
            </div>

            <div class="divider"></div>

            <div class="form-group">
                <label for="email">Authorized Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="investor@nestaxis.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-row">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember terminal access</label>
                </div>
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>

            <button class="btn-primary">Authenticate Account</button>

            <div class="card-footer">
                New partner to the axis? <a href="register.html">Create Portal Account</a>
            </div>

        </div>
    </div>
</body>
</html>
